<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" rx="28" fill="#0f172a"/>
<text x="70" y="95" fill="#e2e8f0" font-size="42" font-family="Arial, sans-serif" font-weight="700">C# 陣列與迴圈</text>
<text x="70" y="140" fill="#94a3b8" font-size="24" font-family="Arial, sans-serif">Index → Value → Next item</text>
<rect x="90" y="230" width="210" height="150" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
<text x="195" y="275" text-anchor="middle" fill="#7dd3fc" font-size="24" font-family="Arial">scores[0]</text><text x="195" y="335" text-anchor="middle" fill="#f8fafc" font-size="52" font-family="Arial" font-weight="700">80</text>
<rect x="355" y="230" width="210" height="150" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
<text x="460" y="275" text-anchor="middle" fill="#7dd3fc" font-size="24" font-family="Arial">scores[1]</text><text x="460" y="335" text-anchor="middle" fill="#f8fafc" font-size="52" font-family="Arial" font-weight="700">90</text>
<rect x="620" y="230" width="210" height="150" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="4"/>
<text x="725" y="275" text-anchor="middle" fill="#7dd3fc" font-size="24" font-family="Arial">scores[2]</text><text x="725" y="335" text-anchor="middle" fill="#f8fafc" font-size="52" font-family="Arial" font-weight="700">75</text>
<path d="M300 305h50M565 305h50M830 305h120" stroke="#fbbf24" stroke-width="8" fill="none" marker-end="url(#arrow)"/>
<text x="970" y="275" fill="#fbbf24" font-size="24" font-family="Arial">for</text><text x="970" y="320" fill="#f8fafc" font-size="22" font-family="Arial">index++</text>
<rect x="145" y="470" width="910" height="70" rx="18" fill="#172554"/>
<text x="600" y="515" text-anchor="middle" fill="#bfdbfe" font-size="25" font-family="Arial">for (int index = 0; index &lt; scores.Length; index++)</text>
<defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/></marker></defs>
</svg>
