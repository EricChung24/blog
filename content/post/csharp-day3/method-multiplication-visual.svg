<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" rx="28" fill="#111827"/>
<text x="70" y="95" fill="#f8fafc" font-size="42" font-family="Arial, sans-serif" font-weight="700">C# 方法與九九乘法表</text>
<text x="70" y="140" fill="#9ca3af" font-size="24" font-family="Arial, sans-serif">Input → Method → Return</text>
<rect x="85" y="220" width="250" height="160" rx="20" fill="#1f2937" stroke="#a78bfa" stroke-width="5"/>
<text x="210" y="270" text-anchor="middle" fill="#c4b5fd" font-size="25" font-family="Arial">number</text><text x="210" y="335" text-anchor="middle" fill="#f8fafc" font-size="54" font-family="Arial" font-weight="700">3</text>
<path d="M350 300h130" stroke="#fbbf24" stroke-width="8" fill="none" marker-end="url(#a)"/>
<rect x="490" y="190" width="310" height="220" rx="20" fill="#312e81" stroke="#c4b5fd" stroke-width="5"/>
<text x="645" y="250" text-anchor="middle" fill="#ede9fe" font-size="27" font-family="Arial">int Power(int n)</text><text x="645" y="315" text-anchor="middle" fill="#fbbf24" font-size="38" font-family="Arial" font-weight="700">return n * n;</text><text x="645" y="370" text-anchor="middle" fill="#c4b5fd" font-size="22" font-family="Arial">可重複呼叫</text>
<path d="M815 300h130" stroke="#fbbf24" stroke-width="8" fill="none" marker-end="url(#a)"/>
<rect x="955" y="220" width="160" height="160" rx="20" fill="#1f2937" stroke="#34d399" stroke-width="5"/>
<text x="1035" y="275" text-anchor="middle" fill="#6ee7b7" font-size="23" font-family="Arial">result</text><text x="1035" y="340" text-anchor="middle" fill="#f8fafc" font-size="54" font-family="Arial" font-weight="700">9</text>
<rect x="145" y="485" width="910" height="65" rx="18" fill="#172554"/><text x="600" y="527" text-anchor="middle" fill="#bfdbfe" font-size="25" font-family="Arial">for (int i = 1; i &lt;= 9; i++)  ×  for (int j = 1; j &lt;= 9; j++)</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#fbbf24"/></marker></defs>
</svg>
